baseURL = "https://www.amusement-creators.info/"
languageCode = "ja-jp"
title = "Amusement Creators"
theme = "ananke"

# 古いTwitterショートコードのエラーを完全に無視して強制ビルドする設定
ignoreLogs = ["error-twitter-shortcode-deprecation", "warning-goldmark-raw-html"]

# デフォルトのヒーローヘッダーを設定
featured_image = "/images/share_thumbnail.png"

# 日本語を使った記事でサマリの文字数がおかしくなるのを防ぐ
hasCJKLanguage = true

# 記事の本文で絵文字(ex. `:+1:, :muscle:`)を有効化
enableEmoji = true

[taxonomies]
  author = "authors"
  tag = "tags"
  category = "categories"

# 最新のMarkdownパーサー(Goldmark)の設定
[markup]
  [markup.goldmark.renderer]
    # 記事の文中のリンクはすべて別タブで開く（旧blackfridayの移行）
    hrefTargetBlank = true
    # 昔の記事のHTML埋め込み（YouTube等）を許可する
    unsafe = true
  [markup.highlight]
    # コードにハイライトを適用（旧pygmentsの移行）
    codeFences = true

[params]
  description = "筑波大学 Amusement Creators"
  images = ["/images/share_thumbnail.png"]
  twitter = "https://twitter.com/ac_is_not_am"
  background_color_class = "bg-white"

[menu]
  [[menu.main]]
    name = "About"
    identifier = "about"
    url = "/about/"
    weight = 1

  [[menu.main]]
    name = "News"
    identifier = "news"
    url = "/news"
    weight = 2

  [[menu.main]]
    name = "Articles"
    identifier = "articles"
    url = "/articles"
    weight = 3

  [[menu.main]]
    name = "Works"
    identifier = "works"
    url = "/works"
    weight = 4

  [[menu.main]]
    name = "Members"
    identifier = "members"
    url = "/members/"
    weight = 5

  [[menu.main]]
    name = "Search"
    identifier = "search"
    url = "/search/"
    weight = 6

[services]
  [services.x]
    disableInlineCSS = true